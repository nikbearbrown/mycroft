<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">Three price steps looked like splits. One was.</title>
  <desc id="figdesc">Three price steps that all looked like stock splits, with the arithmetic that separates them: Perplexity's share count multiplied while its dollar value held exactly, which is a real split; SpaceX reports common and preferred ten times apart on the same day; and Anthropic's step is an ordinary funding round.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">Three price steps looked like splits. One was.</text>
  <text x="40" y="64" font-size="13" fill="#545454">Same shape, three different causes — and only a person could tell them apart</text>
  <text x="40" y="96" font-size="11" fill="#545454" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.06em">WHAT THE NUMBERS SAY</text>
  <text x="660" y="96" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end" font-weight="700" letter-spacing="0.06em">VERDICT</text>
  <line x1="40" y1="106" x2="660" y2="106" stroke="#2a1a0e" stroke-width="1"/>
  <text x="40" y="130" font-size="14" fill="#2a1a0e" font-family="'Inter', sans-serif">Perplexity</text>
  <text x="660" y="130" font-size="13" fill="#C8102E" font-family="'JetBrains Mono', monospace" text-anchor="end">a real 10:1 split</text>
  <text x="40" y="150" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">shares 6,081 → 60,810</text>
  <text x="276" y="150" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">value $4,228,993.75 → $4,228,993.75</text>
  <text x="40" y="167" font-size="11" fill="#545454" font-family="'Inter', sans-serif">ten times the shares, the same dollars to the cent — and the same in all 5 holdings</text>
  <line x1="40" y1="176" x2="660" y2="176" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="202" font-size="14" fill="#2a1a0e" font-family="'Inter', sans-serif">SpaceX</text>
  <text x="660" y="202" font-size="13" fill="#545454" font-family="'JetBrains Mono', monospace" text-anchor="end">not a split</text>
  <text x="40" y="222" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">common 81.00   preferred 810.00</text>
  <text x="280" y="222" font-size="12" fill="#545454" font-family="'JetBrains Mono', monospace">both on 2023-10-31</text>
  <text x="40" y="239" font-size="11" fill="#545454" font-family="'Inter', sans-serif">one filer, one day, ten times apart — a units convention</text>
  <line x1="40" y1="248" x2="660" y2="248" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="274" font-size="14" fill="#2a1a0e" font-family="'Inter', sans-serif">Anthropic</text>
  <text x="660" y="274" font-size="13" fill="#545454" font-family="'JetBrains Mono', monospace" text-anchor="end">not a split</text>
  <text x="40" y="294" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">12.18 → 48.94   ×4.02</text>
  <text x="280" y="294" font-size="12" fill="#545454" font-family="'JetBrains Mono', monospace">then 140, then 259</text>
  <text x="40" y="311" font-size="11" fill="#545454" font-family="'Inter', sans-serif">a funding round, on a staircase that keeps climbing</text>
  <text x="40" y="348" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">Adjust the first. Leave the other two. A detector that treated them alike</text>
  <text x="40" y="366" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">would be wrong two times out of three.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">Source: raw_holdings, balance and value as filed · review_decisions rationales</text>
</svg>
