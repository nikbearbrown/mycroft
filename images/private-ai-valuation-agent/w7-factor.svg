<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">Ratio 11.93. Factor 10.</title>
  <desc id="figdesc">The measured ratio of 11.93 decomposes into a 10:1 split and a 16 percent markdown that happened in the same period. Adjusting by the ratio would erase the markdown; adjusting by the factor keeps it.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">Ratio 11.93. Factor 10.</text>
  <text x="40" y="64" font-size="13" fill="#545454">Two things happened in one quarter, and only one of them is a split</text>
  <rect x="40.0" y="106" width="193.3" height="62" fill="none" stroke="#C8102E" stroke-width="2"/>
  <text x="136.66666666666669" y="144" font-size="20" fill="#C8102E" font-family="'JetBrains Mono', monospace" text-anchor="middle">11.9300</text>
  <text x="136.66666666666669" y="184" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">what the detector measured</text>
  <text x="243.33333333333334" y="142" font-size="18" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">=</text>
  <rect x="253.3" y="106" width="193.3" height="62" fill="none" stroke="#2a1a0e" stroke-width="2"/>
  <text x="350.0" y="144" font-size="20" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="middle">10</text>
  <text x="350.0" y="184" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">the split</text>
  <text x="350.0" y="197" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">which Week 8 divides by</text>
  <text x="456.6666666666667" y="142" font-size="18" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">×</text>
  <rect x="466.7" y="106" width="193.3" height="62" fill="none" stroke="#C8860E" stroke-width="2"/>
  <text x="563.3333333333334" y="144" font-size="20" fill="#C8860E" font-family="'JetBrains Mono', monospace" text-anchor="middle">1.193</text>
  <text x="563.3333333333334" y="184" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">a 16% markdown</text>
  <text x="563.3333333333334" y="197" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="middle">which is a real price move</text>
  <text x="40" y="224" font-size="11" fill="#545454" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.06em">WHAT EACH CHOICE WOULD DO</text>
  <line x1="40" y1="234" x2="660" y2="234" stroke="#2a1a0e" stroke-width="1"/>
  <text x="54" y="246" font-size="13" fill="#545454" font-family="'Inter', sans-serif">Divide by 11.93 and the 16% markdown vanishes: a real price move, erased.</text>
  <text x="54" y="268" font-size="13" fill="#C8102E" font-family="'Inter', sans-serif">Divide by 10 and the markdown survives as what it is.</text>
  <text x="54" y="290" font-size="13" fill="#545454" font-family="'Inter', sans-serif">Divide by nothing and a 10:1 split reads as a 92% crash.</text>
  <line x1="40" y1="234" x2="40" y2="298" stroke="#C8860E" stroke-width="3"/>
  <line x1="40" y1="314" x2="660" y2="314" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="338" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">ARK, 2026-01-30 to 2026-04-30: 695.0374 → 58.2595</text>
  <text x="40" y="360" font-size="12" fill="#545454" font-family="'Inter', sans-serif">So the panel records the adjudicated factor in its own column, separate from the ratio.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">Source: marks.split_ratio against marks.split_factor · adjudicated by a named reviewer</text>
</svg>
