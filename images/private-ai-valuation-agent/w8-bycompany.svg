<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">One headline rate would hide all of this</title>
  <desc id="figdesc">Horizontal bars of the share of consecutive observations that were unchanged, per company, ranging from 1.1% for OpenAI to 48.5% for X.AI.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
