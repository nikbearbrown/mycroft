  <rect x="232" y="288" width="278.0" height="13" fill="#C8102E"/>
  <text x="518.0" y="298" font-size="12" fill="#C8102E" font-family="'JetBrains Mono', monospace">48.5%</text>
  <text x="660" y="298" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">171 steps</text>
  <line x1="40" y1="320" x2="660" y2="320" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="344" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">Anthropic and OpenAI are re-priced at almost every observation.</text>
  <text x="40" y="362" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">X.AI and SpaceX are carried forward a third to a half of the time.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">Source: marks, grouped by company · companies with 10 or more observed steps</text>
</svg>
