  <text x="660" y="122" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">95 steps</text>
  <text x="220" y="144" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">Anthropic PBC</text>
  <rect x="232" y="134" width="12.7" height="13" fill="#2a1a0e"/>
  <text x="252.65718994643592" y="144" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">2.2%</text>
  <text x="660" y="144" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">271 steps</text>
  <text x="220" y="166" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">Cerebras</text>
  <rect x="232" y="156" width="27.3" height="13" fill="#2a1a0e"/>
