  <text x="40" y="64" font-size="13" fill="#545454">Share of consecutive observations unchanged, by company</text>
  <text x="220" y="100" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">Groq</text>
