  <text x="242" y="100" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">0.0%</text>
  <text x="660" y="100" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">11 steps</text>
  <text x="220" y="122" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">OpenAI Group PBC</text>
