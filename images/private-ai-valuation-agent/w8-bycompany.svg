  <text x="354.5447053976102" y="232" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">20.0%</text>
  <text x="660" y="232" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">10 steps</text>
  <text x="220" y="254" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">Anduril</text>
  <rect x="232" y="244" width="136.9" height="13" fill="#2a1a0e"/>
