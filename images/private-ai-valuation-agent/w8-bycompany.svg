  <text x="660" y="188" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">19 steps</text>
  <text x="220" y="210" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif" text-anchor="end">Databricks</text>
  <rect x="232" y="200" width="113.5" height="13" fill="#2a1a0e"/>
  <text x="353.4565306963329" y="210" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">19.8%</text>
  <text x="660" y="210" font-size="10" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">1,812 steps</text>
