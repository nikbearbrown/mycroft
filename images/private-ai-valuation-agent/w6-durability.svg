<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">A paused review lives in the database</title>
  <desc id="figdesc">A diagram of the resolution graph: candidates, recall and triage in sequence, then a fork -- either accept the match, or interrupt and wait for a person. The interrupt writes its state to Postgres, so the process can exit and the question is still waiting afterwards.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">A paused review lives in the database</text>
  <text x="40" y="64" font-size="13" fill="#545454">The graph stops, the process exits, and the question is still waiting</text>
  <rect x="40" y="96" width="210" height="30" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="52" y="116" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">candidates</text>
  <text x="266" y="116" font-size="11" fill="#545454" font-family="'Inter', sans-serif">the matcher reads the name</text>
  <line x1="145.0" y1="126" x2="145.0" y2="134" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="40" y="134" width="210" height="30" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="52" y="154" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">recall</text>
  <text x="266" y="154" font-size="11" fill="#545454" font-family="'Inter', sans-serif">has a human answered this before?</text>
  <line x1="145.0" y1="164" x2="145.0" y2="172" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="40" y="172" width="210" height="30" fill="none" stroke="#2a1a0e" stroke-width="1"/>
  <text x="52" y="192" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">triage</text>
  <text x="266" y="192" font-size="11" fill="#545454" font-family="'Inter', sans-serif">confident, or ask?</text>
  <line x1="115.0" y1="210" x2="115.0" y2="222" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="115.0" y1="222" x2="295.0" y2="222" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="115.0" y1="222" x2="115.0" y2="236" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="40" y="236" width="150" height="30" fill="none" stroke="#D4D4D4" stroke-width="1"/>
  <text x="52" y="256" font-size="13" fill="#545454" font-family="'JetBrains Mono', monospace">accept</text>
  <text x="40" y="282" font-size="11" fill="#545454" font-family="'Inter', sans-serif">write the decision, done</text>
  <line x1="295.0" y1="222" x2="295.0" y2="236" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="220" y="236" width="150" height="30" fill="#C8102E" stroke="#C8102E" stroke-width="1"/>
  <text x="232" y="256" font-size="13" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">interrupt()</text>
  <text x="220" y="282" font-size="11" fill="#C8102E" font-family="'Inter', sans-serif">the run stops here</text>
  <text x="390" y="226" font-size="11" fill="#545454" font-family="'Inter', sans-serif">one or the other, never both</text>
  <line x1="295.0" y1="288" x2="295.0" y2="300" stroke="#C8860E" stroke-width="2"/>
  <rect x="40" y="300" width="620" height="42" fill="none" stroke="#C8860E" stroke-width="2"/>
  <text x="52" y="318" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">Postgres</text>
  <text x="52" y="334" font-size="11" fill="#545454" font-family="'Inter', sans-serif">the paused state, the question, and everything needed to resume it</text>
  <text x="40" y="366" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">Tested by pausing in one process and answering in another.</text>
  <text x="40" y="384" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">Then tested again by accident: the server crashed, and the queue came back whole.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">LangGraph 0.2.60 · langgraph-checkpoint-postgres 2.0.9 · 231 checkpoint threads</text>
</svg>
