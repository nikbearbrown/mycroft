<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">6 pass, 1 unreachable, 0 fail</title>
  <desc id="figdesc">The end-to-end checks plan.md wrote for this project, with their results. One is structurally unreachable because the filings it needs have not been published.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">6 pass, 1 unreachable, 0 fail</text>
  <text x="40" y="64" font-size="13" fill="#545454">plan.md's own verification list, run against the panel</text>
  <text x="40" y="100" font-size="11" fill="#545454" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.06em">CHECK</text>
  <text x="660" y="100" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end" font-weight="700" letter-spacing="0.06em">RESULT</text>
  <line x1="40" y1="110" x2="660" y2="110" stroke="#2a1a0e" stroke-width="1"/>
  <text x="40" y="132" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">Anthropic / Fidelity / 2026-03-31 position</text>
  <text x="660" y="132" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <text x="40" y="154" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">four managers agree at 259.14 in the 3/31-4/30 window</text>
  <text x="660" y="154" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <text x="40" y="176" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">Anthropic 5/29-5/31 pair at ~589</text>
  <text x="660" y="176" font-size="12" fill="#C8860E" font-family="'JetBrains Mono', monospace" text-anchor="end">unreachable</text>
  <text x="40" y="198" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">Perplexity 695 -&gt; 58 flagged and blocked</text>
  <text x="660" y="198" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <text x="40" y="220" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">SpaceX 10x is a unit artifact, not a class differential</text>
  <text x="660" y="220" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <text x="40" y="242" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">World Labs Series C vs C Prime is a real differential</text>
  <text x="660" y="242" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <text x="40" y="264" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">every holding is accounted for</text>
  <text x="660" y="264" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">pass</text>
  <line x1="40" y1="288" x2="660" y2="288" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="312" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">The plan expected four managers to agree at $259.14. 10 do.</text>
  <text x="54" y="330" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">259.1364</text>
  <text x="130" y="330" font-size="11" fill="#545454" font-family="'Inter', sans-serif">8 families — Alger, BlackRock, Capital Group, Coatue, Franklin…</text>
  <text x="54" y="348" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">259.1400</text>
  <text x="130" y="348" font-size="11" fill="#545454" font-family="'Inter', sans-serif">2 families — ARK, Fidelity</text>
  <text x="40" y="382" font-size="11" fill="#545454" font-family="'Inter', sans-serif">They agree to the cent and disagree at four decimals, because filers round differently.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">src/marks/verify.py · each check returns what it found, not a boolean</text>
</svg>
