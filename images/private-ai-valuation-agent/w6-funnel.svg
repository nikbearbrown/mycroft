<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">4,537 resolved themselves. 1,269 needed a person.</title>
  <desc id="figdesc">A stacked bar showing that of 5,806 private holdings, 4,537 were resolved by the deterministic matcher and 1,269 were routed to a human reviewer, behind only 8 distinct questions.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">4,537 resolved themselves. 1,269 needed a person.</text>
  <text x="40" y="64" font-size="13" fill="#545454">5,806 holdings · 231 distinct name/title strings · 8 questions reached a human</text>
  <rect x="40" y="108" width="484.5" height="46" fill="#2a1a0e"/>
  <rect x="524.5" y="108" width="135.5" height="46" fill="#C8102E"/>
  <text x="52" y="138" font-size="20" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">4,537</text>
  <text x="52" y="172" font-size="12" fill="#545454" font-family="'Inter', sans-serif">resolved with no human</text>
  <text x="660" y="172" font-size="12" fill="#C8102E" font-family="'Inter', sans-serif" text-anchor="end">1,269 sent to a person</text>
  <text x="660" y="100" font-size="12" fill="#545454" font-family="'JetBrains Mono', monospace" text-anchor="end">78.1% / 21.9%</text>
  <text x="40" y="208" font-size="11" fill="#545454" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.06em">HOW EACH HOLDING WAS DECIDED</text>
  <text x="660" y="208" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end" font-weight="700" letter-spacing="0.06em">HOLDINGS</text>
  <line x1="40" y1="218" x2="660" y2="218" stroke="#2a1a0e" stroke-width="1"/>
  <text x="40" y="240" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">alias</text>
  <rect x="130" y="230" width="250.0" height="12" fill="#2a1a0e"/>
  <text x="660" y="240" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">2,760</text>
  <text x="574" y="240" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">97 strings</text>
  <text x="40" y="266" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">lei</text>
  <rect x="130" y="256" width="152.3" height="12" fill="#2a1a0e"/>
  <text x="660" y="266" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">1,681</text>
  <text x="574" y="266" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">68 strings</text>
  <text x="40" y="292" font-size="13" fill="#C8102E" font-family="'JetBrains Mono', monospace">human</text>
  <rect x="130" y="282" width="114.9" height="12" fill="#C8102E"/>
  <text x="660" y="292" font-size="13" fill="#C8102E" font-family="'JetBrains Mono', monospace" text-anchor="end">1,269</text>
  <text x="574" y="292" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">42 strings</text>
  <text x="40" y="318" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">fuzzy</text>
  <rect x="130" y="308" width="5.2" height="12" fill="#2a1a0e"/>
  <text x="660" y="318" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">57</text>
  <text x="574" y="318" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">8 strings</text>
  <text x="40" y="344" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace">spv</text>
  <rect x="130" y="334" width="3.5" height="12" fill="#2a1a0e"/>
  <text x="660" y="344" font-size="13" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">39</text>
  <text x="574" y="344" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end">16 strings</text>
  <line x1="40" y1="364" x2="660" y2="364" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40" y="386" font-size="13" fill="#2a1a0e" font-family="'Inter', sans-serif">Every holding is decided. None was dropped for being difficult.</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">Source: match_decisions · Supabase Postgres, 2026-09-04</text>
</svg>
