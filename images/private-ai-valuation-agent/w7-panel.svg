<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figtitle figdesc" font-family="'Inter', sans-serif">
  <title id="figtitle">5,479 marks, and every filed row accounted for</title>
  <desc id="figdesc">A bar showing the 5,806 filed holdings splitting into rejected, superseded by amendment, and aggregated into marks, followed by what the 5,479 marks contain.</desc>
  <rect width="700" height="420" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="20" font-family="'EB Garamond', Georgia, serif" fill="#2a1a0e">5,479 marks, and every filed row accounted for</text>
  <text x="40" y="64" font-size="13" fill="#545454">price per share = value / shares · 232 securities · 55 period ends · 861 panel rows</text>
  <rect x="40.0" y="100" width="609.3" height="40" fill="#2a1a0e"/>
  <rect x="649.3" y="100" width="7.7" height="40" fill="#545454"/>
  <rect x="657.0" y="100" width="3.0" height="40" fill="#C8102E"/>
  <text x="52" y="126" font-size="18" fill="#FFFFFF" font-family="'JetBrains Mono', monospace">5,706</text>
  <text x="40" y="90" font-size="12" fill="#545454" font-family="'Inter', sans-serif">5,806 filed holdings</text>
  <rect x="40" y="153" width="10" height="10" fill="#2a1a0e"/>
  <text x="58" y="162" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">5,706  aggregated into marks</text>
  <rect x="40" y="172" width="10" height="10" fill="#545454"/>
  <text x="58" y="181" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">72  superseded by an amendment</text>
  <rect x="40" y="191" width="10" height="10" fill="#C8102E"/>
  <text x="58" y="200" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">28  not one of ours</text>
  <text x="660" y="181" font-size="12" fill="#C8860E" font-family="'Inter', sans-serif" text-anchor="end">it reconciles, so nothing is lost for being awkward</text>
  <text x="40" y="235" font-size="11" fill="#545454" font-family="'Inter', sans-serif" font-weight="700" letter-spacing="0.06em">WHAT THE MARKS SAY</text>
  <text x="660" y="235" font-size="11" fill="#545454" font-family="'Inter', sans-serif" text-anchor="end" font-weight="700" letter-spacing="0.06em">MARKS</text>
  <line x1="40" y1="245" x2="660" y2="245" stroke="#2a1a0e" stroke-width="1"/>
  <text x="40" y="267" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">priced</text>
  <rect x="410" y="258" width="190.0" height="10" fill="#2a1a0e"/>
  <text x="660" y="267" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">5,185</text>
  <text x="40" y="289" font-size="12" fill="#2a1a0e" font-family="'Inter', sans-serif">re-marked against the prior period</text>
  <rect x="410" y="280" width="112.4" height="10" fill="#2a1a0e"/>
  <text x="660" y="289" font-size="12" fill="#2a1a0e" font-family="'JetBrains Mono', monospace" text-anchor="end">3,067</text>
  <text x="40" y="311" font-size="12" fill="#545454" font-family="'Inter', sans-serif">carried forward unchanged</text>
  <rect x="410" y="302" width="37.3" height="10" fill="#545454"/>
  <text x="660" y="311" font-size="12" fill="#545454" font-family="'JetBrains Mono', monospace" text-anchor="end">1,019</text>
  <text x="40" y="333" font-size="12" fill="#545454" font-family="'Inter', sans-serif">first observation, no prior</text>
  <rect x="410" y="324" width="40.3" height="10" fill="#545454"/>
  <text x="660" y="333" font-size="12" fill="#545454" font-family="'JetBrains Mono', monospace" text-anchor="end">1,099</text>
  <text x="40" y="355" font-size="12" fill="#C8102E" font-family="'Inter', sans-serif">blocked from any change series</text>
  <rect x="410" y="346" width="11.0" height="10" fill="#C8102E"/>
  <text x="660" y="355" font-size="12" fill="#C8102E" font-family="'JetBrains Mono', monospace" text-anchor="end">301</text>
  <text x="40" y="402" font-size="10" fill="#545454" font-family="'JetBrains Mono', monospace">Source: marks, joined to securities, companies and funds</text>
</svg>
