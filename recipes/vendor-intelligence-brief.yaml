---
name: vendor-intelligence-brief
description: |
  Generate structured vendor intelligence brief (6 sections, sourced) for a company.
  Routes through 5 specialized agents (financial, technology, news, personnel, competitive)
  via LLM supervisor. Each agent queries verified signals from PostgreSQL and Neo4j,
  synthesizes evidence, and produces a scored assessment with citations.

status: DRAFT          # 2 gates still open; SPECIFIED requires zero
todos_open: 2
recipe_version: 0.2.0
last_gate: "signal-validation, 2026-08-22, logs/RUN_LOG.md#2026-08-22 (Muskan Khandelwal)"
attestation: null

inputs:
  - company_name (string): Target vendor to brief (e.g., "Cohere", "Anthropic")
  - optional_date (string, ISO-8601): Override run date for historical briefing

outputs:
  - name: brief (JSON object)
    description: |
      Structured 6-section vendor intelligence brief:
      - financial_health: {score: 0-100, signals: [...]}
      - technology_momentum: {score: 0-100, signals: [...]}
      - news_sentiment: {sentiment: positive|neutral|negative, signals: [...]}
      - personnel_stability: {score: 0-100, signals: [...]}
      - competitive_position: {direct_competitors: [...], investor_overlap: [...], edges: [...]}
      - executive_summary: "1 paragraph procurement recommendation"
  - name: metadata (JSON object)
    description: |
      Execution metadata:
      - agents_called: array of agent names in execution order
      - execution_time_ms: number
      - signals_count: number
      - citations_count: number
      - cache_hit: boolean

phase_gates:
  - name: "Signal validation (Phase 2)"
    status: "[CLEARED]"
    cleared_by: "Muskan Khandelwal"
    cleared_date: "2026-08-22"
    description: |
      Signals must be verified as belonging to the named vendor before they can be
      cited as evidence in a brief.

      Cleared at the BATCH level, not per signal. The original wording asked for
      human validation of >= 50% of individual signals; what was actually done is
      stronger in coverage and weaker in depth — every name-searched row in the
      table was machine-checked against the entity filter, and the 782 that failed
      were purged. No per-row human sign-off exists, and the validated_by column
      the original wording assumed is not in the DDL.
    evidence:
      - "collector/audit_entities.py run 2026-08-07 (AI-Vendor-Intelligence-Platform repo)"
      - "backups/wrong_entity_signals_20260807T010057Z.json — 780 rows"
      - "backups/wrong_entity_signals_20260807T010153Z.json — 2 rows"
      - "logs/RUN_LOG.md#2026-08-22 — gate decision, who/what/when"
      - "data/verified/ai_company_signals-schema.yaml v0.2.0 — entity_verification section"
    residual_risk: |
      Removing rows that failed the check does not prove the survivors are correct.
      Common-word vendor names (Adept, Writer, Notion, Glean, Modal, Replicate) can
      still admit unrelated text; for those the only remaining defence is the LLM
      about_company screen, which fails open on API error.
    owner: "Muskan Khandelwal"

  - name: "Supervisor routing review (Phase 2)"
    status: "[TODO]"
    description: |
      Operator reviews Langfuse trace of supervisor's agent-routing decisions.
      Evidence: Trace ID logged in RUN_LOG.md, with operator sign-off on quality.
    owner: "Operations lead (TBD)"

  - name: "Brief approval (Phase 2)"
    status: "[TODO]"
    description: |
      Procurement owner reviews brief before sharing with company.
      Evidence: Sign-off comment in RUN_LOG.md entry linking to brief artifact.
    owner: "Procurement owner (TBD)"

