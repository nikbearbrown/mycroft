---
name: vendor-intelligence-brief
description: |
  Generate structured vendor intelligence brief (6 sections, sourced) for a company.
  Routes through 5 specialized agents (financial, technology, news, personnel, competitive)
  via LLM supervisor. Each agent queries verified signals from PostgreSQL and Neo4j,
  synthesizes evidence, and produces a scored assessment with citations.

status: DRAFT          # 2 gates still open; SPECIFIED requires zero
todos_open: 2
recipe_version: 0.3.0
last_gate: "signal-validation, 2026-08-22, logs/RUN_LOG.md#2026-08-22 (Muskan Khandelwal)"
attestation: null

inputs:
  - company_name (string): Target vendor to brief (e.g., "Cohere", "Anthropic")
  - optional_date (string, ISO-8601): Override run date for historical briefing

outputs:
  - name: brief (JSON object)
    description: |
      Structured 6-section vendor intelligence brief:
      - financial_health: {score: 0-100, signals: [...]}
      - technology_momentum: {score: 0-100, signals: [...]}
      - news_sentiment: {sentiment: positive|neutral|negative, signals: [...]}
      - personnel_stability: {score: 0-100, signals: [...]}
      - competitive_position: {direct_competitors: [...], investor_overlap: [...], edges: [...]}
      - executive_summary: "1 paragraph procurement recommendation"
  - name: metadata (JSON object)
    description: |
      Execution metadata:
      - agents_called: array of agent names in execution order
      - execution_time_ms: number
      - signals_count: number
      - citations_count: number
      - cache_hit: boolean

phase_gates:
  - name: "Signal validation (Phase 2)"
    status: "[CLEARED]"
    cleared_by: "Muskan Khandelwal"
    cleared_date: "2026-08-22"
    description: |
      Signals must be verified as belonging to the named vendor before they can be
      cited as evidence in a brief.

      Cleared at the BATCH level, not per signal. The original wording asked for
      human validation of >= 50% of individual signals; what was actually done is
      stronger in coverage and weaker in depth — every name-searched row in the
      table was machine-checked against the entity filter, and the 782 that failed
      were purged. No per-row human sign-off exists, and the validated_by column
      the original wording assumed is not in the DDL.
    evidence:
      - "collector/audit_entities.py run 2026-08-07 (AI-Vendor-Intelligence-Platform repo)"
      - "backups/wrong_entity_signals_20260807T010057Z.json — 780 rows"
      - "backups/wrong_entity_signals_20260807T010153Z.json — 2 rows"
      - "logs/RUN_LOG.md#2026-08-22 — gate decision, who/what/when"
      - "data/verified/ai_company_signals-schema.yaml v0.2.0 — entity_verification section"
    residual_risk: |
      Removing rows that failed the check does not prove the survivors are correct.
      Common-word vendor names (Adept, Writer, Notion, Glean, Modal, Replicate) can
      still admit unrelated text; for those the only remaining defence is the LLM
      about_company screen, which fails open on API error.
    owner: "Muskan Khandelwal"

  - name: "Supervisor routing review (Phase 2)"
    status: "[TODO]"
    description: |
      Operator reviews Langfuse trace of supervisor's agent-routing decisions.
      Evidence: Trace ID logged in RUN_LOG.md, with operator sign-off on quality.
    owner: "Operations lead (TBD)"

  - name: "Brief approval (Phase 2)"
    status: "[TODO]"
    description: |
      Procurement owner reviews brief before sharing with company.
      Evidence: Sign-off comment in RUN_LOG.md entry linking to brief artifact.
    owner: "Procurement owner (TBD)"

evaluation:
  harness: evaluation/eval_runner.py
  added: "2026-08-26 (platform commit 2b44793)"
  principle: |
    Deterministic checks against the evidence actually collected for the company,
    rather than asking another LLM whether the brief looks right. From the harness
    docstring: where a rule can be written down, write the rule instead of trusting
    a model to judge. This maps onto the verification stack — FAIL is layer 1
    (conformance, halts), WARN is layer 2 (audit, reports for human judgment).

  severities:
    FAIL: "A contract the brief must satisfy. A FAIL is a real defect."
    WARN: |
      A heuristic grounding check. These can flag legitimate aggregates the model
      derived from tool output rather than copying from a headline, so they need a
      human glance, not a red light.

  checks:
    - name: check_structure
      severity: FAIL
      tests: "All six sections present (5 dimensions + EXECUTIVE SUMMARY)."
    - name: check_score_fidelity
      severity: FAIL
      tests: |
        The N/100 in FINANCIAL HEALTH must equal compute_financial_health()'s
        rubric score. Regression test for the class of bug where the LLM invents
        its own number instead of reporting the computed one. Also fails when the
        brief states a score at all but the rubric has no data to compute one.
    - name: check_unknown_discipline
      severity: FAIL
      tests: |
        A dimension with no evidence must say UNKNOWN, not write prose anyway.
        Catches the failure mode where a data source is down and the model fills
        the gap with confident-sounding generalities.
    - name: check_filler
      severity: FAIL
      tests: |
        None of 11 banned phrases ("well positioned", "cutting-edge", "leading
        provider", "at the forefront", ...). If a phrase would be true of any AI
        vendor, it carries no procurement signal.
    - name: check_date_grounding
      severity: WARN
      tests: "Every explicit ISO date in the brief traces to a collected signal."
    - name: check_amount_grounding
      severity: WARN
      tests: |
        Every dollar figure traces to a collected headline. Normalizes units, so
        $1.2B and $1200M compare equal.

  known_limit: |
    The grounding checks verify that a claim traces to a COLLECTED SIGNAL. A
    wrong-entity signal already in the corpus therefore PASSES grounding — the
    figure is real, it just belongs to another company. Grounding cannot catch
    that class; only entity verification upstream can. See the Scale AI entry
    under known_issues.

  human_accuracy_set:
    file: evaluation/labeled_briefs.csv
    rows: 6
    status: |
      UNLABELED. The `accurate` column is empty in every row — claims have been
      queued (via eval_runner.py --emit-labels) but no human has marked any y/n.
      No accuracy rate exists for this system and none may be quoted (P3).

  unit_tests:
    file: evaluation/test_eval_runner.py
    count: 17
    ci: |
      .github/workflows/test.yml (renamed "API Health Check" -> "Tests") runs
      `python -m unittest discover -s evaluation -v` on push/PR to main.
      Fixture-based, so no database, AWS or Neo4j credentials are needed.
      The full eval, which generates real briefs, requires a live environment and
      is run manually: `python evaluation/eval_runner.py`.

