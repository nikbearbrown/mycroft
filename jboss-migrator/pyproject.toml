[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jboss-migrator"
version = "0.1.0"
description = "Config-driven JBoss/EAP application upgrade orchestrator (OpenRewrite, MTA, Eclipse Transformer) with baseline verification and test plans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["playwright>=1.44", "pillow>=10.0"]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8.0"]

[project.scripts]
jboss-migrator = "migrator.cli:main"

[tool.setuptools.packages.find]
include = ["migrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
