name: finance-event-signals

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["19092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fes
      POSTGRES_PASSWORD: fes
      POSTGRES_DB: fes
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fes -d fes"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- observability ---
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../otel/collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on: [jaeger]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ../otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["19093:9090"]
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
    ports: ["13000:3000"]
    depends_on: [prometheus, jaeger]

  topic-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in events.raw events.validated events.enriched events.actionable events.deadletter; do
          rpk topic create "$$t" --brokers redpanda:9092 -p 3 -r 1 || true
        done
        rpk topic list --brokers redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"

  # --- pipeline ---
  ingest-gateway:
    build:
      context: ..
      dockerfile: services/ingest-gateway/Dockerfile
    ports: ["19091:9091"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: ingest-gateway
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      EDGAR_FTS_FORMS: ${EDGAR_FTS_FORMS:-8-K}
      EDGAR_FTS_QUERY: ${EDGAR_FTS_QUERY:-}
      EDGAR_FTS_LOOKBACK_DAYS: ${EDGAR_FTS_LOOKBACK_DAYS:-1}
      EDGAR_ATOM_ENABLED: ${EDGAR_ATOM_ENABLED:-true}
      EDGAR_ATOM_FORMS: ${EDGAR_ATOM_FORMS:-8-K}
      SEC_RATE_LIMIT_PER_SEC: ${SEC_RATE_LIMIT_PER_SEC:-5}
      DEDUP_TTL_SECONDS: ${DEDUP_TTL_SECONDS:-604800}
      KAFKA_BROKERS: redpanda:9092
      REDIS_ADDR: redis:6379
      TOPIC_RAW: events.raw
      GRPC_ADDR: ":9091"
    depends_on:
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  validation-svc:
    build:
      context: ..
      dockerfile: services/validation-svc/Dockerfile
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: validation-svc
      KAFKA_BROKERS: redpanda:9092
      TOPIC_IN: events.raw
      TOPIC_VALIDATED: events.validated
      TOPIC_DEADLETTER: events.deadletter
      GROUP_ID: validation-svc
      FRESHNESS_DAYS: ${FRESHNESS_DAYS:-7}
      TICKERS_PATH: /app/data/company_tickers.json
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  enrichment-svc:
    build:
      context: ../services/enrichment-svc
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: enrichment-svc
      KAFKA_BROKERS: redpanda:9092
      TOPIC_IN: events.validated
      TOPIC_OUT: events.enriched
      GROUP_ID: enrichment-svc
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      ENRICH_SELF_CONSISTENCY_PASSES: ${ENRICH_SELF_CONSISTENCY_PASSES:-2}
      ENRICH_CONF_THRESHOLD: ${ENRICH_CONF_THRESHOLD:-0.5}
    depends_on:
      redpanda: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  persistence-svc:
    build:
      context: ..
      dockerfile: services/persistence-svc/Dockerfile
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: persistence-svc
      KAFKA_BROKERS: redpanda:9092
      TOPIC_IN: events.enriched
      GROUP_ID: persistence-svc
      POSTGRES_DSN: postgres://fes:fes@postgres:5432/fes?sslmode=disable
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }

  query-api:
    build:
      context: ..
      dockerfile: services/query-api/Dockerfile
    ports:
      - "18080:8080"
      - "19090:9090"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: query-api
      POSTGRES_DSN: postgres://fes:fes@postgres:5432/fes?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:9092
      TOPIC_ACTIONABLE: events.actionable
      GRPC_ADDR: ":9090"
      HTTP_ADDR: ":8080"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      otel-collector: { condition: service_started }

  dashboard:
    build:
      context: ../services/dashboard
    ports: ["18501:8501"]
    environment:
      QUERY_API: http://query-api:8080
    depends_on: [query-api]

  # one-shot: `docker compose run --rm outcome-grader`. Not started by `up` —
  # grading is a deliberate act, not a background loop, in dev. The k8s form
  # (deploy/k8s/grader-cronjob.yaml) runs it daily after market close.
  outcome-grader:
    build:
      context: ../services/outcome-grader
    environment:
      POSTGRES_DSN: postgres://fes:fes@postgres:5432/fes?sslmode=disable
      GRADER_HOLDING_DAYS: ${GRADER_HOLDING_DAYS:-1}
      GRADER_MOVE_THRESHOLD_PCT: ${GRADER_MOVE_THRESHOLD_PCT:-0.5}
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
