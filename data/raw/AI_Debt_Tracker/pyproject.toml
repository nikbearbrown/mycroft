[project]
name = "ai-debt-tracker"
version = "0.1.0"
description = "Point-in-time ledger of the bonds and loans financing the AI build-out, built from SEC filings (Mycroft)."
requires-python = ">=3.11"
dependencies = [
    # Week 1: the edgar_pit MCP server. Held below 2.0: mcp 2.x renamed FastMCP to MCPServer,
    # and langchain-mcp-adapters (week 5) is written against the 1.x API.
    "mcp>=1.9,<2",
    # Week 5: the episode supervisor (StateGraph, Send fan-out to readers) and its SQLite checkpointer
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    # Week 2: the grader's one-to-one bond assignment (Hungarian algorithm, DESIGN.md §9.1)
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_debt_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
