version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # QueryService.GetSignal returns Signal directly (not GetSignalResponse) —
    # deliberate: the response IS a Signal. Same for ClearGate reusing Signal.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
