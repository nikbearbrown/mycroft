# redpanda + redis + postgres. Single-replica, ephemeral (emptyDir) — a learning
# cluster, not production. Postgres schema is applied from a ConfigMap (see kustomization).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redpanda, namespace: fes }
spec:
  replicas: 1
  selector: { matchLabels: { app: redpanda } }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          args:
            - redpanda start
            - --smp 1
            - --overprovisioned
            - --node-id 0
            - --kafka-addr PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr PLAINTEXT://redpanda.fes.svc.cluster.local:9092
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "rpk cluster health | grep -q 'Healthy:.*true'"] }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redpanda, namespace: fes }
spec:
  selector: { app: redpanda }
  ports: [{ port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: fes }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: fes }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: fes }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: fes }
            - { name: POSTGRES_PASSWORD, value: fes }
            - { name: POSTGRES_DB, value: fes }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "fes", "-d", "fes"] }
            periodSeconds: 5
      volumes:
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: fes }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# create the topics once redpanda is ready
apiVersion: batch/v1
kind: Job
metadata: { name: topic-init, namespace: fes }
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rpk
          image: redpandadata/redpanda:v24.2.7
          command: ["/bin/sh", "-c"]
          args:
            - |
              until rpk topic list --brokers redpanda:9092 >/dev/null 2>&1; do
                echo waiting for redpanda; sleep 3; done
              for t in events.raw events.validated events.enriched events.actionable events.deadletter; do
                rpk topic create "$t" --brokers redpanda:9092 -p 3 -r 1 || true
              done
              rpk topic list --brokers redpanda:9092
